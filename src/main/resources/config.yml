#Configure the particles. Try to play with all the offset/extra values :)
#https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Particle.html <- go here for all available particles
treasures-particle:
  toggle: true #Whether you want these particles or not
  particle: PORTAL
  count: 40
  offsetX: 0.4
  offsetY: 0.5
  offsetZ: 0.4
  extra: 0 #This is extra data for the particle, usually speed.

treasure-found-particle:
  toggle: true #Whether you want this particle or not
  particle: CRIT
  count: 30
  offsetX: 0.2
  offsetY: 0.3
  offsetZ: 0.2
  extra: 0 #Again, extra data for the particle, usually speed.

#This is the duration of the whole event.
event-duration: "1m" #d -> days; h -> hours; m -> minutes; s -> seconds

#This is the pattern for displaying the End Date of the tournament.
#d -> day ; M -> Month (Letter) ; y -> year ; H -> hour ; m -> minute ; s -> second
end-date-placeholder-format: "dd MMM yyyy HH:mm:ss"

#BOSS BAR
boss-bar: true #true(yes)/false(no)
bar-title: "&6&Treasure Hunt Active!"
bar-title-ended: "&c&lTreasure Hunt Ended! Thanks for your participation. "
bar-title-time-left: "&5&lTime left: %time_left%. &5TIP: Use &l/hints" #Use '%time_left%' for displaying the time.
stop-boss-bar-interval: 10 #Stop the boss bar after <interval> seconds when event ends

#SCOREBOARD
#AVAILABLE PLACEHOLDERS:
#%player_name% -> Display's the player's IGN
#%topN_name% -> The top N player's IGN (N = {1,2,3})
#%topN_count% -> The top N player's treasures found (N = {1,2,3})
#%player_treasures% -> Displays the player's number of found treasures
#%max_treasures% -> Displays the max treasures of the event (configured in treasures.yml)
#%coins_gathered% -> Displays the coins the player found
scoreboard: true #true(yes)/false(no)
scoreboard-interval: 1 #Updates the scoreboard in this interval of time (seconds)
scoreboard-title: "&f💎 &6&lTREASURE HUNT &f💎"
scoreboard-lines:
  - "&aPlayer: &f%player_name%"
  - "&7----------------"
  - "&f&l[&a🏆&f&l] &1&lTOP 3 PLAYERS:"
  - "&6&l1. &6%top1_name% &7- &f%top1_count%"
  - "&e&l2. &e%top2_name% &7- &f%top2_count%"
  - "&c&l3. &c%top3_name% &7- &f%top3_count%"
  - "&7---------------"
  - "&f&l[&a🎁&f&l] &aTreasures Found: &f%player_treasures%/%max_treasures%"
  - "&f&l[&a🪙&f&l] &aCoins Gathered: &f%coins_gathered%" #This line will only appear if the Economy is toggled and working!

#Configure the help command message
#Use '&' for color codes
help-message:
  lines:
    - "&c&l--------------------------------------------------------"
    - "&f&l====[&6&lECHOES OF GOLD HELP&f&l]===="
    - " "
    - "&l/eog enable &r-> enables the event"
    - "&l/eog disable &r-> disables the event"
    - "&l/eog reload &r-> reloads the config of the plugin"
    - "&l/eog event ... &r-> manage main parts of the event"
    - "&l/eog treasures &r-> opens the treasure manager"
    - "&l/eog shop ... &r-> manages the shop part"
    - " "
    - "&e&l! &eThe shop commands work if you the internal economy is enabled"
    - " "
    - "&c&l---------------------------------------------------------"